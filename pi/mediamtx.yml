# MediaMTX owns the CSI camera and shares it with everyone else:
# crowbox-stream (→ YouTube), crowbox_feeder (snapshots), OBS, a browser.
# Keys not listed here keep MediaMTX defaults.

logLevel: info

rtsp: yes
rtspAddress: :8554
webrtc: yes
webrtcAddress: :8889
rtmp: no
hls: no
srt: no

paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1920
    rpiCameraHeight: 1080
    rpiCameraFPS: 30
    rpiCameraBitrate: 4000000
    # keyframe every 2 s: YouTube wants one at least every 4 s
    rpiCameraIDRPeriod: 60
    rpiCameraAfMode: continuous
